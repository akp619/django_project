
  <header class="border-bottom lh-1 py-3">
    <div class="row flex-nowrap justify-content-between align-items-center">
      <div class="col-4 pt-1">
        <a class="link-secondary" href="{% url 'dashboard_home' %}">Dashboard</a>
      </div>
      <div class="col-4 text-center">
        <a
          class="blog-header-logo text-body-emphasis text-decoration-none"
          href="#"
          >Large</a
        >
      </div>


      <div class="col-4 d-flex justify-content-end align-items-center">
          {% if not user.is_authenticated%}
          <a class="btn btn-sm btn-outline-secondary" href="{% url 'login' %}">Login</a> &nbsp;
          <a class="btn btn-sm btn-outline-secondary" href="{% url 'signup' %}">Sign up</a>
          {% endif %}

          {% if user.is_authenticated%}
          <a class="btn btn-sm btn-outline-secondary" href="{% url 'logout' %}">Logout</a>
          {% endif %}
      </div>
    </div>
  </header>
  <div class="nav-scroller py-1 mb-3 border-bottom">
    <nav class="nav nav-underline justify-content-between">

    {% for category in categories %}
      <a class="nav-item nav-link link-body-emphasis active" href="{% url 'categoryBlogs' category.id %}">{{category.name}}</a>
    {% endfor %}
    </nav>
  </div>
