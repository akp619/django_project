{% extends 'main.html' %}

{% block content %}
    <main class="form-signin w-100 m-auto">
        {% if type == 'create' %}
            <form action="{% url 'createBlog' %}" method="POST" enctype="multipart/form-data">
        {% endif %}

        {% if type == 'edit' %}
            <form action="{% url 'editBlog' blog.id%}" method="POST" enctype="multipart/form-data">
        {% endif %}

            {% csrf_token %}

            <h1 class="h3 mb-3 fw-normal">Create Blog</h1>

            {% if form.errors %}
            <div class="alert alert-danger">
                {{ form.errors }}
            </div>
            {% endif %}

            <div class="form-floating">
                <input type="text" class="form-control" name="title" {% if blog %} value="{{blog.title}}" {% endif %} id="floatingInput" placeholder="Title">
                <label for="floatingInput">Title</label>
            </div>

            <div class="form-floating">
                <input type="text" name="short_description" class="form-control" {% if blog %} value="{{blog.short_description}}" {% endif %} id="short_description" placeholder="Short Description">
                <label for="short_description">Short Description</label>
            </div>

            <div class="form-floating">
                <input type="text" name="blog_body" class="form-control" {% if blog %} value="{{blog.blog_body}}" {% endif %} id="blog_body" placeholder="Blog Body">
                <label for="blog_body">Blog Body</label>
            </div>

            <div class="form-check">
                <input type="checkbox" name="is_featured" {% if blog %} value="{{blog.is_featured}}" {% endif %} class="form-check-input" id="exampleCheck1" {% if blog.is_featured %} checked {% endif %}>
                <label class="form-check-label" for="exampleCheck1">Is Featured</label>
            </div>

            <div class="form-group">
              <label for="inputState">Category</label>
              <select id="inputState" class="form-control" name="category">
                {% for categ in category%}
                    <option value="{{categ.id}}" {% if blog %} {% if  blog.category.name == categ.name %} selected {% endif %} {% endif %}>{{categ.name}}</option>
                {% endfor %}
              </select>
            </div>

            <div class="form-group">
              <label for="inputState">Author</label>
              <select id="inputState1" class="form-control" name="author">
                {% for blog_author in author%}
                    <option value="{{blog_author.id}}" {% if blog %} {% if  blog.author.username == blog_author.username %} selected {% endif %} {% endif %}>{{blog_author.username}}</option>
                {% endfor %}
              </select>
            </div>

            <div class="form-group">
                <label for="myfile">Select a file:</label>
                {% if blog %}
                    <img src="{{blog.featured_image.url}}"/>
                {% endif %}
                <input type="file" id="myfile" name="featured_image" accept="image/*" {% if blog %} value="{{blog.featured_image.url}}" {% endif %}><br><br>
            </div>

            <div class="form-group">
              <label for="inputState">Status</label>
              <select id="inputState4" class="form-control" name="status">
                {% for stat in  status %}
                    <option value="{{stat.0}}" {% if blog %} {% if blog.status == stat.0 %} selected {% endif %} {% endif %} >{{stat.1}}</option>
                {% endfor %}
              </select>
            </div>

            <button class="btn btn-primary w-100 py-2 mt-3" type="submit">
                Create Category
            </button>
        </form>
    </main>
{% endblock %}
