{% extends 'main.html' %}

{% block content %}
    <main class="form-signin w-100 m-auto">
        <form action="" method="POST">
            {% csrf_token %}

            <h1 class="h3 mb-3 fw-normal">Create Category</h1>

            {% if form.errors %}
            <div class="alert alert-danger">
                {{ form.errors }}
            </div>
            {% endif %}

            <div class="form-floating">
                <input type="text" class="form-control" name="name" id="floatingInput" placeholder="Category Name">
                <label for="floatingInput">Category Name</label>
            </div>

            <div class="form-floating">
                <input type="text" name="description" class="form-control" id="floatingPassword" placeholder="Description">
                <label for="floatingPassword">Description</label>
            </div>

            <button class="btn btn-primary w-100 py-2 mt-3" type="submit">
                Create Category
            </button>
        </form>
    </main>
{% endblock %}
