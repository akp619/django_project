
{% extends 'main.html' %}
{%load crispy_forms_tags %}
{% block content %}
    <main class="form-signin w-100 m-auto">
        {% if type == 'create' %}
        <form action="{% url 'createUser' %}" method="POST">
        {% endif %}

        {% if type == 'edit' %}
        <form action="{% url 'editUser' user.id %}" method="POST">
        {% endif %}

            {% csrf_token %}

            {{ form|crispy }}

            <button class="btn btn-primary w-100 py-2 mt-3" type="submit">
                Create/ Edit User
            </button>
        </form>
    </main>
{% endblock %}
