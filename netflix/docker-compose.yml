services:

  postgres:
    image: postgres:17
    container_name: postgres-db

    environment:
      POSTGRES_DB: netflix
      POSTGRES_USER: anup
      POSTGRES_PASSWORD: anup

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .

    container_name: netfilx

    ports:
      - "8001:8000"

    volumes:
      - .:/app

    depends_on:
      - postgres

    environment:
      DB_NAME: netflix
      DB_USER: anup
      DB_PASSWORD: anup
      DB_HOST: postgres
      DB_PORT: 5432

volumes:
  postgres_data: