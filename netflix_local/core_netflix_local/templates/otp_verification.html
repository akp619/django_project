{% extends 'main.html' %}
{% block content %}
    <header class="min-h-screen w-full bg-black bg-opacity-75 showcase border-gray-600 border-b-8 flex justify-center py-20 bg-no-repeat"  style="background-image: url('assets/background_netflix.jpg');">
        <div class="z-10 h-full py-32 md:py-0 text-gray-100 w-6/12  flex items-center flex-col">
            <form class="bg-black bg-opacity-70 py-8 px-4 w-8/12 rounded-md" method="POST" action="{% url 'verifyOtp' id %}">
                {% csrf_token %}
                <h1 class="text-4xl font-semibold text-center ">
                    Log In
                </h1>
                <div class=" text-center my-4">
                    <p class="text-primary_red ">
                        {% for message in messages %}
                            {{ message }}
                        {% endfor %}
                    </p>

                </div>
                <div class="mb-3">
                    <Label class='text-lg font-medium mb-3'>
                        OTP
                    </Label>
                    <input class="p-2 bg-gray-200 rounded-sm text-gray-900 outline-none block w-full" type="text" name="otp" id="id_otp" placeholder="Your Otp" maxlength="4">
                </div>
                <div class="flex justify-center items-center mt-">
                    <button class="py-2 px-4 bg-primary_red text-gray-100 font-medium text-lg rounded-md">
                        Verify
                    </button>
                </div>

                <div class="text-center my-4">
                    <a href="{% url 'ResendOtp' id %}">Resend OTP</a>
                    <p>
                        {% if message %}
                            {{message}}
                        {% endif %}
                    </p>
                </div>
            </form>
        </div>
    </header>
{% endblock %}
