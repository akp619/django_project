{% extends 'main.html' %}
{% load static %}
{% block content %}
    <section class='bg-primary_black min-h-screen py-20 md:py-32 flex-col flex items-center'>
        <div class="flex flex-wrap justify-center  w-10/12  md:w-6/12">
            <form class="w-full md:w-8/12 bg-gray-900 p-5 rounded-lg" method="POST">
                {% csrf_token %}

<!--                {{form.as_div}}-->
                <h1 class="text-4xl text-center text-gray-100 font-medium">
                    Create A Profile
                </h1>
                <div class="my-4">
                    <Label class='text-lg text-gray-200 font-medium mb-3'>
                        Profile Name
                    </Label>
                    <input required class="p-2 bg-gray-500 rounded-sm text-gray-200 outline-none block w-full" type="text" name="name" id="id_email" placeholder="Profile name">
                </div>
                <div class="my-4" style="display:none;">
                    <Label class='text-lg text-gray-200 font-medium mb-3'>
                        User
                    </Label>
                    <select class="p-2 bg-gray-500 rounded-sm text-gray-200 outline-none block w-full" name="user" id="id_email">
                        <option value="{{user.id}}">{{user.username}}</option>
                    </select>
                </div>

                <div class="my-4">
                    <Label class='text-lg text-gray-200 font-medium mb-3'>
                        Maturity Level
                    </Label>
                    <select class="p-2 bg-gray-500 rounded-sm text-gray-200 outline-none block w-full"  name="age" id="id_email" >
                        <option value="Kids">Kids</option>
                        <option value="Adults">Adults</option>
                    </select>
                </div>

                {% if messages %}
            <ul class="messages display-error-messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

                <div class="flex justify-center items-center">
                    <button class="px-4 py-2 rounded-md outline-none bg-primary_red text-gray-100">Create Profile</button>
                </div>
            </form> 
        </div>
        
    </section>
{% endblock %}
