services:
  minio:
    image: quay.io/minio/minio
    container_name: minio-local
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console UI Port
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

volumes:
  minio_data: