{% load static %}
<nav class="flex justify-between items-center py-3 px-4 fixed w-full z-50">
    <div class="w-6/12">
        <a href="{% url 'index' %}"><img src="{% static 'images/netflix.png' %}" alt="logo" class="w-5/12 md:w-2/12"></a>
    </div>

    {% if not user.is_authenticated %}
    <div>
        <a class='bg-primary_red py-1 px-3 text-white md:text-lg rounded-md' href="{% url 'login' %}">
            Sign In
        </a>
    </div>

    {% else %}
    <div>
        <a class='bg-primary_red py-1 px-3 text-white md:text-lg rounded-md' href="{% url 'logout' %}">
            Logout
        </a>
    </div>
    {% endif %}
</nav>
